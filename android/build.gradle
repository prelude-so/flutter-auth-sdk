group = "so.prelude.flutterauthsdk"
version = "0.4.0"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "so.prelude.flutterauthsdk"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 26
    }

    dependencies {
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2")
        // Native auth SDK. Pinned to the patch version so the
        // bridge contract this plugin compiles against is the same
        // one consumers resolve transitively at app build time.
        implementation("so.prelude.android:auth-sdk:0.3.0")
        // Anti-fraud signals. Wrapped by PreludeSignalsAdapter and
        // stamped onto unauthenticated logins when an SDK key is
        // configured (manifest meta-data or Dart override). Pin
        // matches the latest published artifact on Maven Central
        // (the Android signals SDK versions independently of the
        // iOS apple-sdk).
        implementation("so.prelude.android:sdk:0.5.2")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
