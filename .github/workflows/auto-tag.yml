name: Auto-tag and dispatch publish on version change
on:
  push:
    branches:
      - main

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Tag from pubspec.yaml version
        id: tag
        run: |
          set -euo pipefail
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; nothing to do."
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "Prelude Tech [bot]"
          git config user.email "hello@prelude.so"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"

  # Default GITHUB_TOKEN tag pushes don't fire downstream workflows
  # (GitHub anti-loop policy), so we dispatch publish.yml explicitly
  # instead of relying on a `push: tags:` trigger. workflow_dispatch
  # is the one trigger GITHUB_TOKEN can fan out to.
  dispatch-publish:
    needs: auto-tag
    if: needs.auto-tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger publish.yml with the new tag
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          # Pass through env to keep the tag value out of the
          # inline-JS literal — avoids quote-injection if the
          # version ever grows a stray ' or `.
          TAG: ${{ needs.auto-tag.outputs.tag }}
        with:
          script: |
            const tag = process.env.TAG;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish.yml',
              ref: tag,             // run publish.yml from the tagged commit
              inputs: { tag },      // pub.dev matches this against tag pattern
            });
